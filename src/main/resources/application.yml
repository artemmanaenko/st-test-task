spring:
  application:
    name: storyteller-task
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://db:5432/storyteller
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: never
  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms
  task:
    scheduling:
      enabled: true
  docker:
    compose:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always

aggregation:
  interval:
    ms: 180000  # 3 minutes

logging:
  level:
    com.storyteller: INFO
    org.springframework: WARN
